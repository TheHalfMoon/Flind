name: Flind browser SDK fast headless capture

on:
    push:
        branches:
            - 'flind-test/browser-capture-fast-*'
            - 'flind-test/browser-origin-guard-*'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: flind-browser-sdk-fast-${{ github.ref }}
    cancel-in-progress: true

jobs:
    smoke:
        runs-on: ubuntu-24.04
        timeout-minutes: 12
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - name: Prepare isolated pinned browser SDK and Playwright runtime
              run: |
                  set -euo pipefail
                  test_dir="$(mktemp -d)"
                  echo "FLIND_BROWSER_SMOKE_DIR=$test_dir" >> "$GITHUB_ENV"
                  npm install --prefix "$test_dir" --ignore-scripts --no-audit --no-fund --save-exact posthog-js@1.447.1 playwright-core@1.55.1
                  cp tools/flind/browser-sdk-headless-capture.test.cjs "$test_dir/"
            - name: Verify bot-filter negative control and local capture transport
              run: |
                  set -euo pipefail
                  (cd "$FLIND_BROWSER_SMOKE_DIR" && node --check browser-sdk-headless-capture.test.cjs && node --test browser-sdk-headless-capture.test.cjs)
            - name: Remove isolated test runtime
              if: always()
              run: |
                  if [ -n "${FLIND_BROWSER_SMOKE_DIR:-}" ]; then rm -rf "$FLIND_BROWSER_SMOKE_DIR"; fi
