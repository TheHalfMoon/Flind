name: Flind in-app inherited link isolation

on:
    push:
        branches:
            - 'flind-ci/inapp-donor-link-isolation-*'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: flind-inapp-links-${{ github.ref }}
    cancel-in-progress: true

jobs:
    guard:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - name: Guard five user-facing support and navigation surfaces
              run: |
                  node --check frontend/bin/flind-inapp-links-isolation.test.mjs
                  node --test frontend/bin/flind-inapp-links-isolation.test.mjs
