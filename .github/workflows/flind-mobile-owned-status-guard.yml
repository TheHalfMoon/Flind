name: Flind mobile owned-status destination guard
on:
    push:
        branches:
            - 'flind-ci/mobile-owned-status-isolation-*'
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: flind-owned-status-${{ github.ref }}
    cancel-in-progress: true
jobs:
    guard:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '26'
            - name: Prevent inherited status polling and links
              run: node --test tools/flind/qualify_mobile_owned_status.mjs
