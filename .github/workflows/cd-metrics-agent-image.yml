# Flind metrics-agent source qualification only.
# Legacy registry/image/chart publishers were intentionally removed from this
# runnable workflow. Reintroducing distribution requires GREEN LIGHT FLIND.
name: Metrics Agent Tests (No Publish)

on:
    pull_request:
        paths:
            - 'products/metrics/agent/**'
            - '.github/workflows/cd-metrics-agent-image.yml'
    push:
        branches:
            - main
        paths:
            - 'products/metrics/agent/**'
            - '.github/workflows/cd-metrics-agent-image.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        name: Metrics agent render, Helm and integration tests
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: products/metrics/agent
                  sparse-checkout-cone-mode: false

            - name: Config render golden tests
              run: products/metrics/agent/tests/render/run.sh

            - name: Helm chart tests
              run: products/metrics/agent/tests/helm/run.sh

            - name: Integration smoke test (exemplars survive scrape to OTLP)
              run: products/metrics/agent/tests/integration/run.sh
