# Flind backend tests on real services. Runs targeted Django test files for brand branches.
# Read-only token, no secrets, nothing published.
name: Flind backend tests

on:
    push:
        branches:
            - 'flind-ci/brand-audit-**'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: flind-backend-tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    pytest:
        runs-on: ubuntu-24.04
        timeout-minutes: 150
        env:
            TEST: '1'
            DEBUG: '1'
            SKIP_SERVICE_VERSION_REQUIREMENTS: '1'
            SECRET_KEY: flind-ci-throwaway-secret
            DATABASE_URL: postgres://posthog:posthog@localhost:5432/posthog
            CLICKHOUSE_HOST: localhost
            CLICKHOUSE_SECURE: 'False'
            CLICKHOUSE_VERIFY: 'False'
            KAFKA_HOSTS: localhost:9092
            REDIS_URL: redis://localhost:6379/
            OTEL_SDK_DISABLED: 'true'
            OTEL_TRACES_EXPORTER: none
            # Test files touched by the brand branches; keep this list in step with them.
            FLIND_TEST_TARGETS: >-
                posthog/tasks/test/test_email.py
                posthog/api/test/test_authentication.py
                posthog/api/test/test_instance_settings.py
                posthog/api/test/test_signup.py
                posthog/tasks/alerts/test
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Free runner disk
              run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

            - name: Start real services
              run: |
                  sed -i 's/--memory 3G/--memory 1G/' docker-compose.base.yml
                  echo "127.0.0.1 kafka clickhouse db redis7 zookeeper" | sudo tee -a /etc/hosts
                  docker compose -f docker-compose.dev.yml up -d --wait db redis7 zookeeper kafka clickhouse
                  docker compose -f docker-compose.dev.yml up --exit-code-from kafka-init kafka-init

            # Views that render the app shell need the built template. A frontend build is out of
            # scope for backend tests, so use the source template the build would emit.
            - name: Provide app shell template
              run: mkdir -p frontend/dist && cp frontend/src/index.html frontend/dist/index.html

            - uses: actions/setup-python@v5
              with:
                  python-version: 3.14.7

            - name: Install Python dependencies
              run: |
                  pip install uv==0.13.4
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev 2>&1 | tail -5

            # Test-DB setup applies persons migrations with sqlx. Same pin as upstream
            # (.github/actions/setup-sqlx-cli), built with the runner's preinstalled cargo because
            # third-party actions are not allowed in this repository.
            - name: Restore sqlx-cli
              id: sqlx-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/sqlx-cli
                  key: sqlx-cli-0.8.0-${{ runner.os }}-${{ runner.arch }}

            - name: Build sqlx-cli
              if: steps.sqlx-cache.outputs.cache-hit != 'true'
              run: cargo install sqlx-cli --version 0.8.0 --features postgres --no-default-features --locked --root "$HOME/.cache/sqlx-cli"

            - name: Add sqlx-cli to PATH
              run: |
                  echo "$HOME/.cache/sqlx-cli/bin" >> "$GITHUB_PATH"
                  "$HOME/.cache/sqlx-cli/bin/sqlx" --version

            # First test-DB setup runs every migration (~35 min on a standard runner), so the
            # per-test timeout must cover it.
            - name: Run targeted tests
              run: |
                  set -o pipefail
                  # These two assert a GeoIP-resolved country; CI has no GeoIP database yet
                  # (known gap, see flind/qualification/migration-runtime-evidence-20261108.md).
                  python -m pytest $FLIND_TEST_TARGETS -p no:cacheprovider -q --timeout=3600 \n                      --deselect posthog/tasks/test/test_email.py::TestEmail::test_login_from_new_device_notification \n                      --deselect posthog/tasks/test/test_email.py::TestEmail::test_login_from_new_device_notification_email_password \n                      2>&1 | tee pytest.log
                  { echo '## Flind backend tests'; echo '```'; tail -40 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

            - name: Tear down
              if: always()
              run: docker compose -f docker-compose.dev.yml down -v --remove-orphans
