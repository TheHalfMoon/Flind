name: Flind mobile Live token isolation

on:
    push:
        branches:
            - 'flind-ci/mobile-live-token-isolation-*'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '26'
            - name: Ensure live tokens cannot leave Flind mobile through inherited endpoints
              run: node --test tools/flind/qualify_mobile_live_isolation.mjs
