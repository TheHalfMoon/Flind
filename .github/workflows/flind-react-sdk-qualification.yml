name: Flind React SDK qualification

on:
    push:
        branches:
            - 'flind-ci/react-sdk-*'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: flind-react-sdk-${{ github.ref }}
    cancel-in-progress: true

jobs:
    qualify:
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Enforce owned React collector in source, ESM and CommonJS
              run: node --test tools/flind/flind-react-owned-host.test.mjs

            - name: Validate exact workspace lockfile without installing full monorepo
              env:
                  HUSKY: '0'
                  CI: 'true'
              run: |
                  set -euo pipefail
                  npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
                  pnpm install --filter=@flind/frontend... --frozen-lockfile --lockfile-only --ignore-scripts

            - name: Test vendored runtime exports and existing React context compatibility
              run: |
                  set -euo pipefail
                  test_dir="$(mktemp -d)"
                  trap 'rm -rf "$test_dir"' EXIT
                  npm install --prefix "$test_dir" --ignore-scripts --no-audit --no-fund                     react@18.3.1 react-dom@18.3.1 posthog-js@1.447.1 @posthog/react@1.11.3
                  mkdir -p "$test_dir/node_modules/@flind"
                  cp -R packages/react "$test_dir/node_modules/@flind/react"
                  cp frontend/bin/flind-react-compat.test.mjs "$test_dir/"
                  ( cd "$test_dir" && node --test flind-react-compat.test.mjs )
