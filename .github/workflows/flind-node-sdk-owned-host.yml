name: Flind private Node SDK owned collector and wire QA
on:
    push:
        branches:
            - 'flind-ci/node-sdk-owned-host-*'
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: flind-node-owned-host-${{ github.ref }}
    cancel-in-progress: true
jobs:
    node:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - name: Guard source and CJS/ESM default-deny host contract
              run: node --test tools/flind/qualify_private_node_host.mjs
            - name: Prepare isolated pinned SDK peer dependencies
              run: |
                  set -euo pipefail
                  sdk_tmp="$(mktemp -d)"
                  echo "FLIND_NODE_HOST_QA_TMP=$sdk_tmp" >> "$GITHUB_ENV"
                  npm install --prefix "$sdk_tmp" --ignore-scripts --no-audit --no-fund posthog-node@5.63.2 @posthog/core@1.64.1
                  mkdir -p "$sdk_tmp/node_modules/@flind"
                  cp -R packages/node-sdk "$sdk_tmp/node_modules/@flind/node"
                  cp -R packages/core "$sdk_tmp/node_modules/@flind/core"
                  cp tools/flind/flind-node-sdk-wire.test.mjs "$sdk_tmp/"
                  cp tools/flind/flind-node-sdk-compat.test.mjs "$sdk_tmp/"
            - name: Assert CJS and ESM ABI and local-only capture (real Node)
              run: |
                  set -euo pipefail
                  cd "$FLIND_NODE_HOST_QA_TMP"
                  node --test flind-node-sdk-compat.test.mjs flind-node-sdk-wire.test.mjs
            - name: Remove temporary SDK files
              if: always()
              run: |
                  if [ -n "${FLIND_NODE_HOST_QA_TMP:-}" ]; then rm -rf "$FLIND_NODE_HOST_QA_TMP"; fi
