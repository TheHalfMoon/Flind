name: Flind browser OAuth token redirect guard
on:
    push:
        branches:
            - 'flind-ci/web-oauth-token-no-redirect-*'
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: flind-web-oauth-redirect-${{ github.ref }}
    cancel-in-progress: true
jobs:
    guard:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '26'
            - name: Reject OAuth refresh/authorization forwarding
              run: node --test tools/flind/qualify_web_oauth_no_redirect.mjs
