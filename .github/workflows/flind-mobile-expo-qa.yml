name: Flind mobile Expo implementation QA
on:
    push:
        branches:
            - 'flind-ci/mobile-expo-target-isolation-*'
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: flind-mobile-expo-qa-${{ github.ref }}
    cancel-in-progress: true
jobs:
    mobile:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        defaults:
            run:
                working-directory: products/mobile
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: products/mobile/.node-version
            - name: Install pinned pnpm without third-party setup actions
              run: npm install --global pnpm@10.29.3
            - name: Install frozen mobile dependencies
              run: pnpm install --frozen-lockfile
            - name: Verify TypeScript
              run: pnpm exec tsc --noEmit
            - name: Verify Expo configuration and build JSON formatting
              run: pnpm exec biome check app.config.ts eas.json
