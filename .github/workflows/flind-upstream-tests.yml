# Flind upstream integration tests: runs the tests that come with cherry-picked upstream changes, in
# their own language (pytest on real services, Go, Node/Jest). Triggered by upstream integration branches.
# Read-only token, no secrets, nothing published.
name: Flind upstream tests

on:
    push:
        branches:
            - 'flind-ci/upstream-**'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: flind-upstream-tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    pytest:
        runs-on: ubuntu-24.04
        timeout-minutes: 150
        env:
            TEST: '1'
            DEBUG: '1'
            SKIP_SERVICE_VERSION_REQUIREMENTS: '1'
            SECRET_KEY: flind-ci-throwaway-secret
            DATABASE_URL: postgres://posthog:posthog@localhost:5432/posthog
            CLICKHOUSE_HOST: localhost
            CLICKHOUSE_SECURE: 'False'
            CLICKHOUSE_VERIFY: 'False'
            KAFKA_HOSTS: localhost:9092
            REDIS_URL: redis://localhost:6379/
            OTEL_SDK_DISABLED: 'true'
            OTEL_TRACES_EXPORTER: none
            # Python test files carried by the upstream changes on this branch.
            FLIND_TEST_TARGETS: >-
                ee/api/test/test_authentication.py
                products/access_control/backend/tests/test_property_access_control.py
                products/feature_flags/backend/api/test/test_feature_flag.py
                products/security/backend/tests/test_accounts.py
                products/security/backend/tests/test_decisions.py
                products/warehouse_sources/backend/temporal/data_imports/pipelines/core/test_repartition.py
                products/error_tracking/backend/tests/test_issue_summaries.py
                posthog/api/test/test_person.py
                posthog/api/test/test_project.py
                posthog/api/test/test_team.py
                posthog/api/test/test_team_project_parity.py
                posthog/models/person/test/test_point_in_time_properties_integration.py
                posthog/test/test_utils.py
                products/cdp/backend/api/test/test_plugin.py
                products/exports/backend/tasks/test/test_csv_exporter.py
                products/exports/backend/tasks/test/test_csv_exporter_renders.py
                products/exports/backend/tasks/test/test_csv_exporter_url_sanitising.py
                products/tasks/backend/temporal/process_task/activities/tests/test_provision_sandbox.py
                products/tasks/backend/temporal/process_task/tests/test_workflow.py
                posthog/hogql/test/test_restricted_properties.py
                posthog/hogql/transforms/test/test_property_types.py
                posthog/hogql_queries/test/test_events_query_runner.py
                posthog/tasks/test/test_team_metadata_token_reset.py
                posthog/tasks/test/test_team_access_cache_tasks.py
                posthog/tasks/test/test_task_registration.py
                products/groups/backend/tests/test_clickhouse_groups.py
                posthog/api/test/test_activity_log.py
                posthog/api/advanced_activity_logs/test_filters.py
            # Node tests carried by upstream changes that need the test databases (same services).
            FLIND_NODE_DB_TEST_TARGETS: >-
                src/common/utils/team-manager.test.ts
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Free runner disk
              run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

            - name: Start real services
              run: |
                  set -o pipefail
                  sed -i 's/--memory 3G/--memory 1G/' docker-compose.base.yml
                  # Load every funnel UDF version, as upstream's E2E and MCP workflows do before starting ClickHouse.
                  cp posthog/user_scripts/latest_user_defined_function.xml docker/clickhouse/user_defined_function.xml
                  echo "127.0.0.1 kafka clickhouse db redis7 zookeeper objectstorage" | sudo tee -a /etc/hosts
                  docker compose -f docker-compose.dev.yml up -d --wait db redis7 zookeeper kafka clickhouse objectstorage
                  docker compose -f docker-compose.dev.yml up --exit-code-from kafka-init kafka-init

            - name: Provide app shell template
              run: mkdir -p frontend/dist && cp frontend/src/index.html frontend/dist/index.html

            - uses: actions/setup-python@v5
              with:
                  python-version: 3.14.7

            - name: Install Python dependencies
              run: |
                  set -o pipefail
                  pip install uv==0.13.4
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev 2>&1 | tail -5

            # Pinned sqlx-cli for the persons test database; same pin as flind-backend-tests.yml.
            - name: Restore sqlx-cli
              id: sqlx-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/sqlx-cli
                  key: sqlx-cli-0.8.0-${{ runner.os }}-${{ runner.arch }}

            - name: Build sqlx-cli
              if: steps.sqlx-cache.outputs.cache-hit != 'true'
              run: cargo install sqlx-cli --version 0.8.0 --features postgres --no-default-features --locked --root "$HOME/.cache/sqlx-cli"

            - name: Add sqlx-cli to PATH
              run: echo "$HOME/.cache/sqlx-cli/bin" >> "$GITHUB_PATH"

            - name: Check migrations match models
              run: python manage.py makemigrations --check --dry-run

            # The first test-DB setup runs every migration, so the per-test timeout must cover it.
            - name: Run upstream Python tests
              run: |
                  set -o pipefail
                  python -m pytest $FLIND_TEST_TARGETS -p no:cacheprovider -q --timeout=3600 2>&1 | tee pytest.log
                  { echo '## Upstream Python tests'; echo '```'; tail -40 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            # Same install pattern as the node job below: scripts off, then rebuild.
            - name: Install Node dependencies
              env:
                  HUSKY: '0'
                  SKIP_ELECTRON_REBUILD: '1'
              run: |
                  set -o pipefail
                  npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
                  if ! pnpm install --frozen-lockfile --ignore-scripts --filter=@flind/root --filter=@flind/nodejs... > install.log 2>&1; then
                      grep -n -B 30 -A 5 'ELIFECYCLE\|ERR_PNPM' install.log | tail -120
                      exit 1
                  fi
                  if ! pnpm rebuild --filter=@flind/nodejs... > rebuild.log 2>&1; then
                      grep -n -B 20 -A 5 'Failed\|ELIFECYCLE\|ERR_PNPM' rebuild.log | tail -80
                      exit 1
                  fi

            # setup:test builds the Django test database and the Rust-owned test databases (sqlx-cli above).
            - name: Node tests that need the test databases
              working-directory: nodejs
              env:
                  # The job-level DATABASE_URL names the dev database; Node tests use test_posthog, which
                  # setup:test builds (the same URL Node's config defaults to under test).
                  DATABASE_URL: postgres://posthog:posthog@localhost:5432/test_posthog
              run: |
                  set -o pipefail
                  pnpm setup:test 2>&1 | tail -20
                  pnpm exec jest --runInBand --forceExit $FLIND_NODE_DB_TEST_TARGETS 2>&1 | tee jest-db.log
                  { echo '## Upstream Node DB tests'; echo '```'; tail -30 jest-db.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

            - name: Tear down
              if: always()
              run: docker compose -f docker-compose.dev.yml down -v --remove-orphans

    go:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - uses: actions/setup-go@v5
              with:
                  go-version-file: livestream/go.mod

            - name: Livestream tests
              working-directory: livestream
              run: go test ./...

    node:
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            # Same install pattern as flind-frontend-tests.yml: scripts off, then rebuild.
            - name: Install Node dependencies
              env:
                  HUSKY: '0'
                  SKIP_ELECTRON_REBUILD: '1'
              run: |
                  set -o pipefail
                  npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
                  if ! pnpm install --frozen-lockfile --ignore-scripts --filter=@flind/root --filter=@flind/nodejs... > install.log 2>&1; then
                      grep -n -B 30 -A 5 'ELIFECYCLE\|ERR_PNPM' install.log | tail -120
                      exit 1
                  fi
                  tail -3 install.log
                  if ! pnpm rebuild --filter=@flind/nodejs... > rebuild.log 2>&1; then
                      grep -n -B 20 -A 5 'Failed\|ELIFECYCLE\|ERR_PNPM' rebuild.log | tail -80
                      exit 1
                  fi

            - name: Node tests carried by upstream changes
              working-directory: nodejs
              run: pnpm exec jest src/common/utils/oob-domains.test.ts

    frontend:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        env:
            # Frontend test files carried by the upstream changes on this branch.
            FLIND_JEST_TARGETS: >-
                src/lib/utils/destinationSecretRedaction.test.ts
                src/lib/components/AuthorizedUrlList/AuthorizedUrlList.test.tsx
                src/lib/components/ProductEmptyState/ProductEmptyState.test.tsx
                src/scenes/hog-functions/configuration/hogFunctionConfigurationLogic.test.ts
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            # Same install pattern as flind-frontend-tests.yml: root first, then the frontend, scripts
            # off, then rebuild.
            - name: Install dependencies
              env:
                  HUSKY: '0'
                  SKIP_ELECTRON_REBUILD: '1'
              run: |
                  set -o pipefail
                  npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
                  install() {
                      if ! pnpm install --frozen-lockfile "$@" > install.log 2>&1; then
                          grep -n -B 30 -A 5 'ELIFECYCLE\|ERR_PNPM' install.log | tail -120
                          exit 1
                      fi
                      tail -3 install.log
                  }
                  install --ignore-scripts --filter=@flind/root
                  install --ignore-scripts --filter=@flind/frontend...
                  if ! pnpm rebuild --filter=@flind/frontend... > rebuild.log 2>&1; then
                      grep -n -B 20 -A 5 'Failed\|ELIFECYCLE\|ERR_PNPM' rebuild.log | tail -80
                      exit 1
                  fi
                  test -x frontend/node_modules/.bin/jest

            - name: Frontend tests carried by upstream changes
              working-directory: frontend
              run: |
                  set -o pipefail
                  pnpm build:products 2>&1 | tail -40
                  pnpm exec jest $FLIND_JEST_TARGETS 2>&1 | tee jest.log
                  { echo '## Upstream frontend tests'; echo '```'; tail -30 jest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    mcp:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Install dependencies
              env:
                  HUSKY: '0'
                  SKIP_ELECTRON_REBUILD: '1'
              run: |
                  set -o pipefail
                  npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
                  install() {
                      if ! pnpm install --frozen-lockfile "$@" > install.log 2>&1; then
                          grep -n -B 30 -A 5 'ELIFECYCLE\|ERR_PNPM' install.log | tail -120
                          exit 1
                      fi
                      tail -3 install.log
                  }
                  install --ignore-scripts --filter=@flind/root
                  install --ignore-scripts --filter=@flind/mcp...
                  if ! pnpm rebuild --filter=@flind/mcp... > rebuild.log 2>&1; then
                      grep -n -B 20 -A 5 'Failed\|ELIFECYCLE\|ERR_PNPM' rebuild.log | tail -80
                      exit 1
                  fi

            - name: MCP unit tests carried by upstream changes
              working-directory: services/mcp
              run: |
                  set -o pipefail
                  pnpm exec vitest run tests/unit/credential-redaction.test.ts tests/unit/StateManager.test.ts 2>&1 | tee vitest.log
                  { echo '## Upstream MCP tests'; echo '```'; tail -20 vitest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
