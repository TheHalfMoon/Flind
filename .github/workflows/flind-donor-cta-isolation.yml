name: Flind inherited CTA isolation

on:
    push:
        branches:
            - 'flind-ci/donor-cta-isolation-*'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: flind-donor-cta-${{ github.ref }}
    cancel-in-progress: true

jobs:
    guard:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - name: Verify local-only upgrade and feature-flag links
              run: |
                  node --check frontend/bin/flind-donor-cta-isolation.test.mjs
                  node --test frontend/bin/flind-donor-cta-isolation.test.mjs
