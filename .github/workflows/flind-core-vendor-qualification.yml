name: Flind staged core SDK full-source parity

on:
    push:
        branches:
            - 'flind-ci/core-sdk-vendor-*'
            - 'flind-ci/types-core-integration-*'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: flind-core-sdk-vendor-${{ github.ref }}
    cancel-in-progress: true

jobs:
    core:
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - name: Validate private Flind core TypeScript declaration imports
              run: npx --yes --package typescript@7.0.2 tsc -p tools/flind/tsconfig.core-types.json
            - name: Install pinned published core to isolated temporary location
              shell: bash
              run: |
                  set -euo pipefail
                  temp_dir="$(mktemp -d)"
                  echo "FLIND_CORE_QA_TMP=$temp_dir" >> "$GITHUB_ENV"
                  npm install --prefix "$temp_dir" --no-audit --no-fund --ignore-scripts @posthog/core@1.64.1
                  mkdir -p "$temp_dir/node_modules/@flind"
                  cp -R packages/core "$temp_dir/node_modules/@flind/core"
                  cp -R packages/types "$temp_dir/node_modules/@flind/types"
                  cp tools/flind/flind-core-vendor.test.mjs "$temp_dir/"
            - name: Verify full vendored source, CJS/ESM ABI, license and provenance
              shell: bash
              run: |
                  set -euo pipefail
                  cd "$FLIND_CORE_QA_TMP"
                  node --test flind-core-vendor.test.mjs
            - name: Remove temporary core test dependencies
              if: always()
              shell: bash
              run: |
                  if [ -n "${FLIND_CORE_QA_TMP:-}" ]; then rm -rf "$FLIND_CORE_QA_TMP"; fi
