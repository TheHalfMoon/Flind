name: Flind SDK catalog offline logo qualification

on:
    push:
        branches:
            - 'flind-security/sdk-logo-offline-assets-*'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    local-logo-contract:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - name: Verify no catalog CDN requests and pinned original logo bytes
              run: |
                  node --check frontend/bin/flind-sdk-local-logo-assets.test.mjs
                  node --test frontend/bin/flind-sdk-local-logo-assets.test.mjs
