name: Flind mobile owned legal destinations
on:
    push:
        branches:
            - 'flind-ci/mobile-owned-legal-links-*'
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: flind-mobile-legal-${{ github.ref }}
    cancel-in-progress: true
jobs:
    guard:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '26'
            - name: Verify legal links and AI consent fail closed
              run: node --test tools/flind/qualify_mobile_legal_isolation.mjs
