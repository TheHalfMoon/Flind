name: Flind Live TUI token isolation

on:
    push:
        branches:
            - 'flind-ci/live-tui-host-isolation-*'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: flind-tui-host-isolation-${{ github.ref }}
    cancel-in-progress: true

jobs:
    go:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: livestream/go.mod
                  cache-dependency-path: livestream/go.sum
            - name: Verify token routing and hostname protection
              working-directory: livestream
              run: |
                  go test ./tui/auth ./tui/config
