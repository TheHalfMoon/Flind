<!DOCTYPE html>
<html lang="en">
    <head>{% include "head.html" %}</head>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4ef;
            color: #111;
            font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif;
        }
        main {
            max-width: 32rem;
            padding: 1.5rem;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem;
        }
        p {
            margin: 0;
            line-height: 1.5;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background: #1d1f27;
                color: #fff;
            }
        }
    </style>
    <body>
        {# Self-contained on purpose: an error page must not depend on, or report to, any external site. #}
        <main>
            <h1>Flind is temporarily unavailable</h1>
            <p>Something went wrong on our side. Please try again in a moment. If this keeps happening, contact your Flind administrator.</p>
        </main>
    </body>
</html>
