plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.thehalfmoon.flind.mobile'
version = '1.0.0'

android {
  namespace "com.thehalfmoon.flind.mobile.notifications"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation project(':expo-notifications')
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
}
